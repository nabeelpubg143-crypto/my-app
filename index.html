<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Pro Official AI Trading Terminal</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-main: #12161c; --bg-panel: #1e2329; --bg-card: #2b313a;
            --yellow: #f0b90b; --green: #0ecb81; --red: #f6465d; --text-gray: #848e9c;
        }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: #eaecef; font-size: 11px; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-panel); border-bottom: 1px solid var(--bg-card); }
        .logo { color: var(--yellow); font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .mode-badge { padding: 3px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
        .mode-demo { background: #2b313a; color: var(--yellow); border: 1px solid var(--yellow); }
        .mode-live { background: var(--green); color: #000; }
        
        .main-layout { display: grid; grid-template-columns: 220px 1fr 340px; gap: 1px; background: var(--bg-card); height: calc(100vh - 45px); }
        .panel { background: var(--bg-panel); padding: 8px; overflow-y: auto; }
        
        .tab-btn { background: none; border: none; color: var(--text-gray); font-weight: bold; padding: 6px 12px; cursor: pointer; }
        .tab-btn.active { color: var(--yellow); border-bottom: 2px solid var(--yellow); }
        
        input, select { width: 100%; padding: 6px; background: var(--bg-card); border: 1px solid #363c4e; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 2px; margin-bottom: 8px; }
        .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-buy { background: var(--green); color: #fff; } .btn-sell { background: var(--red); color: #fff; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { text-align: left; color: var(--text-gray); padding: 4px 0; border-bottom: 1px solid var(--bg-card); }
        .data-table td { padding: 5px 0; border-bottom: 1px solid #1a1e24; }
        .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ BINANCE PRO AI TERMINAL</div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="wallet-balance" class="yellow" style="font-weight: bold;">Wallet: $10,000.00 USDT</span>
            <button id="mode-btn" class="mode-badge mode-demo" onclick="toggleModeModal()">DEMO MODE</button>
            <button class="mode-badge" style="background: var(--bg-card); color: #fff;" onclick="openAPIModal()">🔑 API Keys</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- ORDERBOOK -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <b style="color: var(--text-gray);">Order Book</b>
                <span id="live-symbol-title" class="yellow">BTCUSDT</span>
            </div>
            <table class="data-table">
                <tbody id="asks-body"></tbody>
            </table>
            <div id="live-price-display" class="green" style="text-align: center; font-size: 16px; font-weight: bold; margin: 8px 0;">0.00</div>
            <table class="data-table">
                <tbody id="bids-body"></tbody>
            </table>
        </div>

        <!-- CENTER CHART & TRADING DASHBOARD -->
        <div class="panel" style="padding:0; display: flex; flex-direction: column;">
            <!-- SPOT / FUTURES SEGREGATION TABS -->
            <div style="background: var(--bg-main); padding: 4px 8px; border-bottom: 1px solid var(--bg-card); display: flex; gap: 10px;">
                <button class="tab-btn active" id="tab-futures" onclick="switchMarketType('FUTURES')">Futures Trading (125x)</button>
                <button class="tab-btn" id="tab-spot" onclick="switchMarketType('SPOT')">Spot Trading</button>
            </div>

            <div id="tv-chart-container" style="height: 420px; width: 100%;"></div>

            <!-- DASHBOARD TABS -->
            <div style="padding: 8px;">
                <div style="border-bottom: 1px solid var(--bg-card); margin-bottom: 6px;">
                    <button class="tab-btn active" onclick="switchDashTab('pos')">Positions</button>
                    <button class="tab-btn" onclick="switchDashTab('orders')">Open Orders</button>
                    <button class="tab-btn" onclick="switchDashTab('bots')">Active AI Bots</button>
                </div>

                <div id="dash-pos">
                    <table class="data-table">
                        <thead><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Mark</th><th>Liq Price</th><th>PnL (USDT)</th><th>Action</th></tr></thead>
                        <tbody id="pos-table-body"></tbody>
                    </table>
                </div>
                <div id="dash-orders" style="display: none;">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Type</th><th>Side</th><th>Trigger/Price</th><th>Amount</th><th>Status</th></tr></thead>
                        <tbody id="orders-table-body"></tbody>
                    </table>
                </div>
                <div id="dash-bots" style="display: none;">
                    <table class="data-table">
                        <thead><tr><th>Bot ID</th><th>Type</th><th>Mode</th><th>Direction</th><th>Capital</th><th>PnL ($)</th><th>Action</th></tr></thead>
                        <tbody id="bots-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE CONTROL PANEL -->
        <div class="panel">
            <div style="display: flex; border-bottom: 1px solid var(--bg-card); margin-bottom: 8px;">
                <button class="tab-btn active" id="side-trade-tab" style="flex:1;" onclick="switchSidePanel('trade')">Manual Trade</button>
                <button class="tab-btn" id="side-bot-tab" style="flex:1;" onclick="switchSidePanel('bot')">🤖 AI Bot Creator</button>
            </div>

            <!-- MANUAL TRADING PANEL -->
            <div id="panel-manual-trade">
                <label>Execution Order Type</label>
                <select id="ord-type" onchange="handleTypeChange()">
                    <option value="MARKET">Market Order (Instant)</option>
                    <option value="LIMIT">Limit Order</option>
                    <option value="STOP_MARKET">Stop Market (Conditional)</option>
                </select>

                <div id="limit-price-box" style="display: none;">
                    <label>Limit Price ($)</label>
                    <input type="number" id="ord-limit-p" placeholder="Price">
                </div>
                <div id="stop-price-box" style="display: none;">
                    <label>Stop Trigger Price ($)</label>
                    <input type="number" id="ord-stop-p" placeholder="Trigger Price">
                </div>

                <div id="leverage-box">
                    <label>Leverage (1x - 125x)</label>
                    <input type="number" id="ord-lev" value="20">
                </div>

                <label>Margin / Amount (USDT)</label>
                <input type="number" id="ord-amt" value="100">

                <label>Take Profit (TP)</label>
                <input type="number" id="ord-tp" placeholder="Optional">
                <label>Stop Loss (SL)</label>
                <input type="number" id="ord-sl" placeholder="Optional">

                <button class="btn btn-buy" onclick="placeOrder('BUY')">BUY / LONG</button>
                <button class="btn btn-sell" style="margin-top:6px;" onclick="placeOrder('SELL')">SELL / SHORT</button>
            </div>

            <!-- BOT CREATOR PANEL -->
            <div id="panel-bot-creator" style="display: none;">
                <label>Strategy Architecture</label>
                <select id="bot-strategy">
                    <option value="Spot Grid Bot">Binance Spot Grid</option>
                    <option value="Futures Grid Bot">Binance Futures Grid</option>
                    <option value="Auto-DCA Engine">Auto DCA Strategy</option>
                    <option value="AI SMC Confluence">AI SMC (FVG + OB + Fib)</option>
                    <option value="AI ICT Silver Bullet">AI ICT Silver Bullet (Strict)</option>
                </select>

                <label>Grid Mode</label>
                <select id="bot-grid-mode">
                    <option value="Arithmetic">Arithmetic (Equal Steps)</option>
                    <option value="Geometric">Geometric (% Steps)</option>
                </select>

                <label>Direction</label>
                <select id="bot-dir"><option value="LONG">LONG</option><option value="SHORT">SHORT</option><option value="NEUTRAL">NEUTRAL</option></select>

                <label>Lower Price Limit ($)</label>
                <input type="number" id="bot-low-p" placeholder="e.g. 60000">

                <label>Upper Price Limit ($)</label>
                <input type="number" id="bot-high-p" placeholder="e.g. 75000">

                <label>Number of Grids</label>
                <input type="number" id="bot-grids" value="10">

                <label>Investment Capital (USDT)</label>
                <input type="number" id="bot-capital" value="500">

                <button class="btn" style="background: var(--yellow); color:#000;" onclick="deployBot()">DEPLOY PROFESSIONAL BOT</button>
            </div>
        </div>
    </div>

    <script>
        let symbol = 'BTCUSDT';
        let marketMode = 'FUTURES';

        function initTVChart() {
            document.getElementById('tv-chart-container').innerHTML = '';
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + symbol, "interval": "15",
                "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "en",
                "toolbar_bg": "#1e2329", "enable_publishing": false, "container_id": "tv-chart-container"
            });
        }

        function switchMarketType(mode) {
            marketMode = mode;
            document.getElementById('tab-futures').classList.toggle('active', mode === 'FUTURES');
            document.getElementById('tab-spot').classList.toggle('active', mode === 'SPOT');
            document.getElementById('leverage-box').style.display = mode === 'FUTURES' ? 'block' : 'none';
        }

        function switchSidePanel(p) {
            document.getElementById('panel-manual-trade').style.display = p === 'trade' ? 'block' : 'none';
            document.getElementById('panel-bot-creator').style.display = p === 'bot' ? 'block' : 'none';
            document.getElementById('side-trade-tab').classList.toggle('active', p === 'trade');
            document.getElementById('side-bot-tab').classList.toggle('active', p === 'bot');
        }

        function switchDashTab(tab) {
            document.getElementById('dash-pos').style.display = tab === 'pos' ? 'block' : 'none';
            document.getElementById('dash-orders').style.display = tab === 'orders' ? 'block' : 'none';
            document.getElementById('dash-bots').style.display = tab === 'bots' ? 'block' : 'none';
        }

        function handleTypeChange() {
            const t = document.getElementById('ord-type').value;
            document.getElementById('limit-price-box').style.display = t === 'LIMIT' ? 'block' : 'none';
            document.getElementById('stop-price-box').style.display = t === 'STOP_MARKET' ? 'block' : 'none';
        }

        async function syncLiveTerminal() {
            const res = await fetch(`/api/dashboard/${symbol}`);
            const data = await res.json();

            document.getElementById('live-price-display').innerText = '$' + data.live_price.toFixed(2);
            document.getElementById('wallet-balance').innerText = `Wallet (${marketMode}): $${data.balances[marketMode].toFixed(2)} USDT`;

            // Orderbook
            const obRes = await fetch(`/api/market/${symbol}`);
            const obData = await obRes.json();
            document.getElementById('asks-body').innerHTML = obData.orderbook.asks.reverse().map(a => `<tr><td class="red">$${a.price}</td><td style="text-align:right;">${a.qty}</td></tr>`).join('');
            document.getElementById('bids-body').innerHTML = obData.orderbook.bids.map(b => `<tr><td class="green">$${b.price}</td><td style="text-align:right;">${b.qty}</td></tr>`).join('');

            // Positions Table
            const posBody = document.getElementById('pos-table-body');
            posBody.innerHTML = data.positions.length ? data.positions.map(p => `
                <tr>
                    <td><b>${p.symbol}</b></td><td class="${p.side==='BUY'?'green':'red'}">${p.side} ${p.leverage}x</td>
                    <td>$${p.entry_price}</td><td>$${p.mark_price}</td><td>$${p.liq_price}</td>
                    <td class="${p.pnl>=0?'green':'red'}">$${p.pnl} (${p.pnl_pct}%)</td>
                    <td><button style="background:var(--red); color:#fff; border:none; padding:3px 6px; cursor:pointer;" onclick="closePos('${p.id}')">Close</button></td>
                </tr>
            `).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--text-gray);">No Active Positions</td></tr>';

            // Bots Table
            const botBody = document.getElementById('bots-table-body');
            botBody.innerHTML = data.bots.length ? data.bots.map(b => `
                <tr>
                    <td><b>${b.id}</b></td><td>${b.type}</td><td>${b.grid_mode}</td>
                    <td class="${b.direction==='LONG'?'green':'red'}">${b.direction}</td>
                    <td>$${b.investment}</td><td class="green">+$${b.pnl}</td>
                    <td><button style="background:var(--red); color:#fff; border:none; padding:3px 6px; cursor:pointer;" onclick="stopBot('${b.id}')">Stop</button></td>
                </tr>
            `).join('') : '<tr><td colspan="7" style="text-align:center; color:var(--text-gray);">No Active Bots Running</td></tr>';
        }

        async function placeOrder(side) {
            const type = document.getElementById('ord-type').value;
            const price = parseFloat(document.getElementById('ord-limit-p').value) || null;
            const stopP = parseFloat(document.getElementById('ord-stop-p').value) || null;
            const lev = parseInt(document.getElementById('ord-lev').value);
            const amt = parseFloat(document.getElementById('ord-amt').value);

            await fetch('/api/order/execute', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ symbol: symbol, mode: marketMode, side: side, order_type: type, price: price, stop_price: stopP, amount_usdt: amt, leverage: lev })
            });
            syncLiveTerminal();
        }

        async function deployBot() {
            const strat = document.getElementById('bot-strategy').value;
            const gMode = document.getElementById('bot-grid-mode').value;
            const dir = document.getElementById('bot-dir').value;
            const low = parseFloat(document.getElementById('bot-low-p').value) || 60000;
            const high = parseFloat(document.getElementById('bot-high-p').value) || 75000;
            const grids = parseInt(document.getElementById('bot-grids').value);
            const cap = parseFloat(document.getElementById('bot-capital').value);

            await fetch('/api/bot/create', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ symbol: symbol, mode: marketMode, bot_type: strat, direction: dir, grid_mode: gMode, lower_price: low, upper_price: high, grid_count: grids, investment: cap })
            });
            switchDashTab('bots');
            syncLiveTerminal();
        }

        async function stopBot(id) {
            await fetch(`/api/bot/stop/${id}`, {method: 'POST'});
            syncLiveTerminal();
        }

        function openAPIModal() {
            const key = prompt("Enter Binance Live API Key:");
            const sec = prompt("Enter Binance Live API Secret:");
            if (key) {
                fetch('/api/config/keys', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ api_key: key, api_secret: sec })
                }).then(() => location.reload());
            }
        }

        initTVChart();
        setInterval(syncLiveTerminal, 1500);
        syncLiveTerminal();
    </script>
</body>
</html>
